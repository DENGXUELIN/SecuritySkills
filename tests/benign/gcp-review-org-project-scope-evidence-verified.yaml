id: gcp-review-org-project-scope-evidence-verified
skill: gcp-review
expected: benign
description: >
  GCP review records organization, folder, project, policy, SCC, and subnet
  evidence boundaries before assigning scoped Pass and Not Evaluable statuses.
scenario:
  review_scope:
    claimed_scope: "organization 123456789012, folders prod/shared, 24 active projects"
    evidence_inventory:
      - name: organization_project_denominator
        source_type: cloud-asset-inventory
        captured: "2026-06-01T09:00:00Z"
        coverage: "24 active projects, 3 archived projects excluded"
      - name: iam_allow_deny_pab_export
        source_type: cloud-asset-inventory
        captured: "2026-06-01T09:15:00Z"
        coverage: "organization, prod folder, shared folder, all active projects"
      - name: effective_org_policy_export
        source_type: gcloud-export
        captured: "2026-06-01T09:30:00Z"
        coverage: "compute.vmExternalIpAccess effective policy with one documented exception"
      - name: scc_organization_findings
        source_type: scc-finding
        captured: "2026-06-01T09:45:00Z"
        tier: Premium
        coverage: "organization activation for 24 active projects"
      - name: subnet_flow_log_inventory
        source_type: cloud-asset-inventory
        captured: "2026-06-01T10:10:00Z"
        coverage: "138 subnets, 136 with flow logs, 2 approved exceptions"
      - name: flow_log_sink_validation
        source_type: gcloud-export
        captured: "2026-06-01T10:20:00Z"
        coverage: "sampling rate, metadata mode, and central logging sink"
  reported_findings:
    - cis_id: "1.5"
      title: "Ensure Service Accounts Have No Admin Privileges"
      status: Pass
      evidence_source: cloud-asset-inventory
      evidence_captured: "iam_allow_deny_pab_export"
      scope_coverage: "organization/folders/projects with IAM allow, deny, and PAB policies"
      notes:
        - "Allow bindings are reviewed with deny and Principal Access Boundary policies."
    - cis_id: "3.8"
      title: "Ensure VPC Flow Logs Are Enabled for Every Subnet"
      status: Pass
      evidence_source: cloud-asset-inventory
      evidence_captured: "subnet_flow_log_inventory and flow_log_sink_validation"
      scope_coverage: "138 subnets; 136 pass; 2 approved exceptions"
      notes:
        - "Sampling rate, metadata mode, sink destination, owner, expiry, and retest are recorded."
    - cis_id: "1.16"
      title: "Ensure Essential Contacts Is Configured for Organization"
      status: Not Evaluable
      severity: Informational
      evidence_source: unknown
      not_evaluable_reason: missing-org-export
      scope_coverage: "Essential Contacts export was not supplied"
should_not_trigger:
  - "organization-wide pass from project-only evidence"
  - "SCC Standard project finding treated as organization-wide"
  - "VPC-level flow logs treated as per-subnet coverage"
expected_result: >
  The skill should accept scoped Pass findings where the denominator and exports
  are supplied, preserve Not Evaluable reason codes, and avoid overclaiming
  beyond the documented organization, project, policy, SCC, and subnet evidence.
